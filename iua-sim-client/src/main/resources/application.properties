quarkus.http.port=8080

## simulator properties
version=1.0.0
instanceId=b0bc3081
replicaId=001

# the redirect URI this client is registered at the authorization server
# for the authorization code flow
redirectUri=https://0.0.0.0:8080/callback

## URL the simulation service listens to.
simulationServiceUrl=https://0.0.0.0:8080/simulation/v1/

## URL of the test environment to send the service metadata to.
## The simulation report is not configured here: it goes to the callback URL the
## test environment supplies with each simulation setup request.
websocket.url.base=ws://localhost:9090/service-registration

## URL of the mock test environment when running on docker
# websocket.url.base=ws://iua-ru-mock:9090/service-registration

## required by the Gazelle simulation manager factory, which runs the simulations on a thread pool
gzl.executor.thread.pool=10